services:
  api:
    image: assetflow-backend:dev
    pull_policy: build
    build:
      context: .
      dockerfile: apps/api/Dockerfile

  netmon:
    image: assetflow-netmon:dev
    pull_policy: build
    build:
      context: .
      dockerfile: apps/netmon/Dockerfile

  web:
    image: assetflow-frontend:dev
    pull_policy: build
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_DEMO_MODE: "false"
