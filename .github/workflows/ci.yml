name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod
      - name: Format check
        working-directory: apps/agent
        run: test -z "$(gofmt -l .)"
      - name: Agent unit tests
        working-directory: apps/agent
        run: go test ./...
      - name: Agent static analysis
        working-directory: apps/agent
        run: go vet ./...
      - name: Build Windows and Linux agents
        working-directory: apps/agent
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/assetflow-agent-windows-amd64.exe ./cmd/assetflow-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/assetflow-agent-linux-amd64 ./cmd/assetflow-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/assetflow-agent-linux-arm64 ./cmd/assetflow-agent
          sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: assetflow-agent-ci
          path: apps/agent/dist/
          if-no-files-found: error

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Validate Prisma schema
        run: npm run db:validate
        env:
          DATABASE_URL: postgresql://assetflow:assetflow@localhost:5432/assetflow
      - run: npm run build
      - name: Unit and service tests
        run: npm run test
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Filesystem and secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: node_modules
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: assetflow
          POSTGRES_USER: assetflow_bootstrap
          POSTGRES_PASSWORD: bootstrap_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assetflow_bootstrap -d assetflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Initialize separate migration and runtime database roles
        env:
          PGPASSWORD: bootstrap_ci_password
        run: |
          psql -h localhost -U assetflow_bootstrap -d assetflow -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE assetflow_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'migrator_ci_password';
          CREATE ROLE assetflow_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'runtime_ci_password';
          ALTER DATABASE assetflow OWNER TO assetflow_migrator;
          ALTER SCHEMA public OWNER TO assetflow_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT CONNECT ON DATABASE assetflow TO assetflow_runtime;
          GRANT USAGE ON SCHEMA public TO assetflow_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE assetflow_migrator IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO assetflow_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE assetflow_migrator IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO assetflow_runtime;
          SQL
      - name: Apply all migrations on a clean PostgreSQL database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://assetflow_migrator:migrator_ci_password@localhost:5432/assetflow
      - name: Verify migration state
        run: npx prisma migrate status --schema apps/api/prisma/schema.prisma
      - name: API integration tests against PostgreSQL
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://assetflow_migrator:migrator_ci_password@localhost:5432/assetflow
        env:
          DATABASE_URL: postgresql://assetflow_migrator:migrator_ci_password@localhost:5432/assetflow
      - name: Verify runtime database role cannot perform DDL
        run: |
          PGPASSWORD=runtime_ci_password psql -h localhost -U assetflow_runtime -d assetflow -c 'SELECT COUNT(*) FROM inventory_sessions; SELECT COUNT(*) FROM asset_import_batches; SELECT COUNT(*) FROM endpoint_agents; SELECT COUNT(*) FROM agent_inventory_snapshots; SELECT COUNT(*) FROM discovery_inbox_items;'
          if PGPASSWORD=runtime_ci_password psql -h localhost -U assetflow_runtime -d assetflow -c 'CREATE TABLE ddl_must_fail(id int)'; then
            echo 'Runtime role unexpectedly has DDL permission' >&2
            exit 1
          fi

  docker-build:
    needs: [agent-test-build, test-and-build, migration-smoke]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [web, api]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.component }} image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          build-args: APP_VERSION=ci
          push: false
          load: true
          tags: assetflow-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Scan ${{ matrix.component }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: assetflow-${{ matrix.component }}:ci
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
